{% extends "base.html" %}

{% block title %}CSV 파일 업로드{% endblock %}

{% block content %}
    <h2>지출 내역 CSV 파일 업로드</h2>
    <p>은행/카드사에서 다운로드한 CSV 파일을 업로드하여 데이터를 일괄 등록합니다.</p>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">업로드 및 저장</button>
    </form>
    
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endblock %}
